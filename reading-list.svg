<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .book-card {{ fill: #0B0B0D; stroke: #1F2937; stroke-width: 1.2; rx: 10px; }}
      .book-glow {{ fill: none; stroke: #00BCD4; stroke-width: 1; opacity: 0.35; rx: 10px; }}
      
      .book-cover-frame {{ stroke: #334155; stroke-width: 1; rx: 5px; }}
      .cover-main-title {{ font-family: 'Space Grotesk', sans-serif; font-weight: 800; text-anchor: middle; }}
      .cover-sub-title {{ font-family: 'Space Grotesk', sans-serif; font-weight: 600; text-anchor: middle; }}
      .cover-author-tag {{ font-family: 'Fira Code', monospace; font-size: 8px; font-weight: 600; text-anchor: middle; }}
      
      .meta-title {{ font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; fill: #F5F5F7; }}
      .meta-author {{ font-family: 'Fira Code', monospace; font-size: 10.5px; fill: #00BCD4; font-weight: 600; }}
      .meta-desc {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #B7B7BC; }}
      .badge-text {{ font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #001F3F; }}
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111114" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>

    <!-- REALISTIC BOOK 1: THE PHOENIX PROJECT -->
    <linearGradient id="phoenixReal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="40%" stop-color="#2C0D05" />
      <stop offset="80%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <!-- REALISTIC BOOK 2: THE GOAL -->
    <linearGradient id="goalReal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001026" />
      <stop offset="40%" stop-color="#002B5B" />
      <stop offset="80%" stop-color="#005B96" />
      <stop offset="100%" stop-color="#00BCD4" />
    </linearGradient>

    <!-- REALISTIC BOOK 3: THE UNICORN PROJECT -->
    <linearGradient id="unicornReal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10051C" />
      <stop offset="40%" stop-color="#240046" />
      <stop offset="80%" stop-color="#5A189A" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- REALISTIC BOOK 4: THE DEVOPS HANDBOOK -->
    <linearGradient id="handbookReal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031926" />
      <stop offset="40%" stop-color="#0A3641" />
      <stop offset="80%" stop-color="#0F7173" />
      <stop offset="100%" stop-color="#2EC4B6" />
    </linearGradient>

    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#39D353" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g transform="translate(5, 10)">
    
    <!-- ==================== 1. THE PHOENIX PROJECT ==================== -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="218" height="285" class="book-card" fill="url(#cardBg)" />
      <rect x="0" y="0" width="218" height="285" class="book-glow" />
      
      <!-- ACTUAL BOOK COVER ART -->
      <g transform="translate(14, 14)">
        <rect x="0" y="0" width="82" height="122" rx="4" fill="url(#phoenixReal)" class="book-cover-frame" />
        <!-- 3D Book Spine Shadow -->
        <rect x="0" y="0" width="6" height="122" fill="#000000" fill-opacity="0.35" rx="2" />
        <!-- Gold Ribbon Tag -->
        <rect x="10" y="8" width="62" height="12" rx="2" fill="#FFBA08" />
        <text x="41" y="17" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="800" fill="#000000" text-anchor="middle">BESTSELLER</text>
        
        <!-- Phoenix Flame Silhouette -->
        <path d="M 41 38 Q 47 48 41 58 Q 35 48 41 38 Z" fill="#FFDD00" />
        <path d="M 41 42 Q 52 50 41 62 Q 30 50 41 42 Z" fill="#FF6B00" fill-opacity="0.6" />
        
        <!-- Cover Typography -->
        <text x="41" y="78" class="cover-main-title" fill="#FFFFFF" font-size="11">THE</text>
        <text x="41" y="90" class="cover-main-title" fill="#FFBA08" font-size="10.5">PHOENIX</text>
        <text x="41" y="101" class="cover-sub-title" fill="#FF6B00" font-size="8.5">PROJECT</text>
        <text x="41" y="114" class="cover-author-tag" fill="#FFFFFF">GENE KIM</text>
      </g>

      <!-- METADATA (RIGHT) -->
      <g transform="translate(106, 18)">
        <rect x="0" y="0" width="80" height="18" rx="3" fill="url(#pill1)" />
        <text x="40" y="13" text-anchor="middle" class="badge-text">DEVOPS CORE</text>
        <text x="0" y="42" class="meta-title">The Phoenix</text>
        <text x="0" y="58" class="meta-title">Project</text>
        <text x="0" y="78" class="meta-author">Gene Kim</text>
        <text x="0" y="94" class="meta-author">Kevin Behr</text>
      </g>

      <!-- DETAILS (BOTTOM) -->
      <g transform="translate(14, 155)">
        <line x1="0" y1="0" x2="190" y2="0" stroke="#1F2937" stroke-width="1" />
        <text x="0" y="24" class="meta-desc">• The Three Ways of DevOps.</text>
        <text x="0" y="44" class="meta-desc">• Fast flow &amp; fast feedback.</text>
        <text x="0" y="64" class="meta-desc">• Breaking organizational silos.</text>
      </g>
    </g>

    <!-- ==================== 2. THE GOAL ==================== -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="218" height="285" class="book-card" fill="url(#cardBg)" />
      <rect x="0" y="0" width="218" height="285" class="book-glow" />
      
      <!-- ACTUAL BOOK COVER ART -->
      <g transform="translate(14, 14)">
        <rect x="0" y="0" width="82" height="122" rx="4" fill="url(#goalReal)" class="book-cover-frame" />
        <rect x="0" y="0" width="6" height="122" fill="#000000" fill-opacity="0.35" rx="2" />
        
        <rect x="10" y="8" width="62" height="12" rx="2" fill="#00BCD4" />
        <text x="41" y="17" font-family="'Space Grotesk', sans-serif" font-size="6" font-weight="800" fill="#001F3F" text-anchor="middle">CLASSIC TOC</text>
        
        <!-- Bullseye Target graphic -->
        <circle cx="41" cy="48" r="18" fill="none" stroke="#00BCD4" stroke-width="1.5" />
        <circle cx="41" cy="48" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
        <circle cx="41" cy="48" r="5" fill="#00BCD4" />
        
        <text x="41" y="80" class="cover-main-title" fill="#FFFFFF" font-size="12">THE</text>
        <text x="41" y="96" class="cover-main-title" fill="#00BCD4" font-size="15">GOAL</text>
        <text x="41" y="114" class="cover-author-tag" fill="#B7B7BC">E. GOLDRATT</text>
      </g>

      <!-- METADATA (RIGHT) -->
      <g transform="translate(106, 18)">
        <rect x="0" y="0" width="75" height="18" rx="3" fill="#003366" />
        <text x="37.5" y="13" text-anchor="middle" class="badge-text" fill="#00BCD4">THEORY TOC</text>
        <text x="0" y="42" class="meta-title">The</text>
        <text x="0" y="58" class="meta-title">Goal</text>
        <text x="0" y="78" class="meta-author">Eliyahu M.</text>
        <text x="0" y="94" class="meta-author">Goldratt</text>
      </g>

      <!-- DETAILS (BOTTOM) -->
      <g transform="translate(14, 155)">
        <line x1="0" y1="0" x2="190" y2="0" stroke="#1F2937" stroke-width="1" />
        <text x="0" y="24" class="meta-desc">• Theory of Constraints (TOC).</text>
        <text x="0" y="44" class="meta-desc">• Bottleneck identification.</text>
        <text x="0" y="64" class="meta-desc">• Throughput &amp; flow balance.</text>
      </g>
    </g>

    <!-- ==================== 3. THE UNICORN PROJECT ==================== -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="218" height="285" class="book-card" fill="url(#cardBg)" />
      <rect x="0" y="0" width="218" height="285" class="book-glow" />
      
      <!-- ACTUAL BOOK COVER ART -->
      <g transform="translate(14, 14)">
        <rect x="0" y="0" width="82" height="122" rx="4" fill="url(#unicornReal)" class="book-cover-frame" />
        <rect x="0" y="0" width="6" height="122" fill="#000000" fill-opacity="0.35" rx="2" />
        
        <rect x="10" y="8" width="62" height="12" rx="2" fill="#E0AAFF" />
        <text x="41" y="17" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="800" fill="#240046" text-anchor="middle">5 IDEALS</text>
        
        <!-- Unicorn Origami Graphic -->
        <polygon points="41,30 52,50 30,50" fill="#E0AAFF" fill-opacity="0.5" />
        <polygon points="41,30 46,50 36,50" fill="#FFFFFF" />
        <line x1="41" y1="30" x2="41" y2="22" stroke="#FFD6FF" stroke-width="2" stroke-linecap="round" />
        
        <text x="41" y="75" class="cover-main-title" fill="#FFFFFF" font-size="10.5">THE</text>
        <text x="41" y="87" class="cover-main-title" fill="#E0AAFF" font-size="10">UNICORN</text>
        <text x="41" y="98" class="cover-sub-title" fill="#C77DFF" font-size="8.5">PROJECT</text>
        <text x="41" y="114" class="cover-author-tag" fill="#FFFFFF">GENE KIM</text>
      </g>

      <!-- METADATA (RIGHT) -->
      <g transform="translate(106, 18)">
        <rect x="0" y="0" width="88" height="18" rx="3" fill="#3C096C" />
        <text x="44" y="13" text-anchor="middle" class="badge-text" fill="#E0AAFF">ARCHITECTURE</text>
        <text x="0" y="42" class="meta-title">The Unicorn</text>
        <text x="0" y="58" class="meta-title">Project</text>
        <text x="0" y="78" class="meta-author">Gene Kim</text>
        <text x="0" y="94" class="meta-author">IT Revolution</text>
      </g>

      <!-- DETAILS (BOTTOM) -->
      <g transform="translate(14, 155)">
        <line x1="0" y1="0" x2="190" y2="0" stroke="#1F2937" stroke-width="1" />
        <text x="0" y="24" class="meta-desc">• The Five Ideals of Architecture.</text>
        <text x="0" y="44" class="meta-desc">• Locality &amp; Developer Joy.</text>
        <text x="0" y="64" class="meta-desc">• Focus &amp; Psychological Safety.</text>
      </g>
    </g>

    <!-- ==================== 4. THE DEVOPS HANDBOOK ==================== -->
    <g transform="translate(684, 0)">
      <rect x="0" y="0" width="218" height="285" class="book-card" fill="url(#cardBg)" />
      <rect x="0" y="0" width="218" height="285" class="book-glow" />
      
      <!-- ACTUAL BOOK COVER ART -->
      <g transform="translate(14, 14)">
        <rect x="0" y="0" width="82" height="122" rx="4" fill="url(#handbookReal)" class="book-cover-frame" />
        <rect x="0" y="0" width="6" height="122" fill="#000000" fill-opacity="0.35" rx="2" />
        
        <rect x="10" y="8" width="62" height="12" rx="2" fill="#2EC4B6" />
        <text x="41" y="17" font-family="'Space Grotesk', sans-serif" font-size="6" font-weight="800" fill="#031926" text-anchor="middle">ENGINEERING</text>
        
        <!-- Infinity Loop symbol for DevOps -->
        <path d="M 29 48 C 29 40 38 40 41 48 C 44 56 53 56 53 48 C 53 40 44 40 41 48 C 38 56 29 56 29 48 Z" fill="none" stroke="#2EC4B6" stroke-width="2.5" stroke-linecap="round" />
        
        <text x="41" y="74" class="cover-main-title" fill="#FFFFFF" font-size="10">THE</text>
        <text x="41" y="86" class="cover-main-title" fill="#2EC4B6" font-size="9.5">DEVOPS</text>
        <text x="41" y="98" class="cover-sub-title" fill="#CBF3F0" font-size="8">HANDBOOK</text>
        <text x="41" y="114" class="cover-author-tag" fill="#FFFFFF">KIM / HUMBLE</text>
      </g>

      <!-- METADATA (RIGHT) -->
      <g transform="translate(106, 18)">
        <rect x="0" y="0" width="85" height="18" rx="3" fill="#003366" />
        <text x="42.5" y="13" text-anchor="middle" class="badge-text" fill="#00BCD4">PRACTICES</text>
        <text x="0" y="42" class="meta-title">The DevOps</text>
        <text x="0" y="58" class="meta-title">Handbook</text>
        <text x="0" y="78" class="meta-author">Kim, Humble</text>
        <text x="0" y="94" class="meta-author">Debois, Willis</text>
      </g>

      <!-- DETAILS (BOTTOM) -->
      <g transform="translate(14, 155)">
        <line x1="0" y1="0" x2="190" y2="0" stroke="#1F2937" stroke-width="1" />
        <text x="0" y="24" class="meta-desc">• Continuous Delivery &amp; CI/CD.</text>
        <text x="0" y="44" class="meta-desc">• Telemetry &amp; feedback loops.</text>
        <text x="0" y="64" class="meta-desc">• Enterprise-scale resilience.</text>
      </g>
    </g>

  </g>
</svg>