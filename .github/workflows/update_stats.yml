name: Update GitHub Telemetry & Stats

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Telemetry Generation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_github_stats.py

      - name: Commit & Push updated telemetry SVG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-stats-v2.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(telemetry): auto-update GitHub stats & languages [skip ci]"
            git push origin main
          fi
