name: Update GitHub Telemetry & Stats

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"

jobs:
  update-stats:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Telemetry Generation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_github_stats.py

      - name: Commit & Push updated telemetry SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore(telemetry): auto-update GitHub stats & languages [skip ci]"
            if ! git push origin main 2>/dev/null; then
              echo "Direct push blocked by branch protection. Pushing to branch and creating PR..."
              BRANCH="telemetry/update-$(date +%Y%m%d-%H%M%S)"
              git checkout -b "$BRANCH"
              git push origin "$BRANCH"
              gh pr create --title "chore(telemetry): auto-update GitHub stats & languages" \
                           --body "Automated daily update of profile GitHub telemetry & stats SVG." \
                           --base main --head "$BRANCH" || true
            fi
          fi
