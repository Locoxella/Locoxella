<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs>
    <!-- Sharp crisp rendering for pixel art -->
    <style>
      .pixel-art { shape-rendering: crispEdges; }
    </style>
    
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111114" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g transform="translate(8, 10)">
    
    <!-- ==================== BOOK 1: THE PHOENIX PROJECT ==================== -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="214" height="350" rx="8" fill="url(#bgCard)" stroke="#1F2937" stroke-width="1.2" />
      
      <!-- PIXEL ART COVER (120x160 px) -->
      <g transform="translate(47, 16)">
        <!-- 3D Book Base -->
        <rect x="0" y="0" width="120" height="160" rx="4" fill="#0F111A" stroke="#334155" stroke-width="1" />
        <!-- Left spine shadow -->
        <rect x="0" y="0" width="8" height="160" fill="#000000" fill-opacity="0.4" rx="2" />
        
        <!-- Top Yellow Bestseller Band -->
        <rect x="16" y="10" width="92" height="14" fill="#F59E0B" />
        <rect x="22" y="14" width="80" height="6" fill="#78350F" />
        
        <!-- Dark Blue to Fiery Orange Sky -->
        <rect x="16" y="28" width="92" height="75" fill="#1E1B4B" />
        <rect x="16" y="65" width="92" height="38" fill="#7C2D12" />
        <rect x="16" y="80" width="92" height="23" fill="#EA580C" />
        <rect x="16" y="92" width="92" height="11" fill="#F97316" />
        
        <!-- Pixel Art Phoenix Flame (Center) -->
        <g transform="translate(54, 45)" class="pixel-art">
          <rect x="4" y="0" width="4" height="4" fill="#FEF08A" />
          <rect x="2" y="4" width="8" height="4" fill="#FDE047" />
          <rect x="0" y="8" width="12" height="4" fill="#FACC15" />
          <rect x="-2" y="12" width="16" height="6" fill="#FB923C" />
          <rect x="-4" y="18" width="20" height="8" fill="#F97316" />
          <rect x="-6" y="26" width="24" height="8" fill="#EA580C" />
          <rect x="-4" y="34" width="20" height="6" fill="#C2410C" />
          <rect x="-2" y="40" width="16" height="4" fill="#9A3412" />
          <!-- Inner White Glow -->
          <rect x="3" y="8" width="6" height="16" fill="#FFFFFF" />
          <rect x="4" y="12" width="4" height="18" fill="#FEF08A" />
        </g>
        
        <!-- White Title Box (The Phoenix Project) -->
        <rect x="16" y="108" width="92" height="36" fill="#FFFFFF" />
        <!-- Pixel typography block lines -->
        <rect x="24" y="113" width="76" height="6" fill="#0F172A" />
        <rect x="20" y="122" width="84" height="9" fill="#DC2626" />
        <rect x="28" y="133" width="68" height="5" fill="#1E293B" />
        
        <!-- Bottom Author Band -->
        <rect x="16" y="146" width="92" height="8" fill="#0F172A" />
        <rect x="30" y="148" width="64" height="3" fill="#94A3B8" />
      </g>

      <!-- Badge (DevOps Core) -->
      <g transform="translate(67, 190)">
        <rect x="0" y="0" width="80" height="18" rx="3" fill="#00BCD4" />
        <text x="40" y="12.5" font-family="monospace" font-size="9" font-weight="bold" fill="#001F3F" text-anchor="middle" dominant-baseline="middle">DEVOPS CORE</text>
      </g>

      <!-- Clean Typography Description -->
      <text x="107" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F5F5F7" text-anchor="middle">The Phoenix Project</text>
      <text x="107" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#00BCD4" text-anchor="middle">Gene Kim, Kevin Behr</text>
      <line x1="24" y1="262" x2="190" y2="262" stroke="#1F2937" stroke-width="1" />
      
      <text x="107" y="284" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• The Three Ways of DevOps</text>
      <text x="107" y="304" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Fast flow &amp; feedback loops</text>
      <text x="107" y="324" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Breaking silo bottlenecks</text>
    </g>

    <!-- ==================== BOOK 2: THE GOAL ==================== -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="214" height="350" rx="8" fill="url(#bgCard)" stroke="#1F2937" stroke-width="1.2" />
      
      <!-- PIXEL ART COVER (120x160 px) -->
      <g transform="translate(47, 16)">
        <rect x="0" y="0" width="120" height="160" rx="4" fill="#0A192F" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="8" height="160" fill="#000000" fill-opacity="0.4" rx="2" />
        
        <!-- Deep Blue Ocean Background -->
        <rect x="16" y="10" width="92" height="144" fill="#03203C" />
        
        <!-- Pixel Art Radar / Target (Center) -->
        <g transform="translate(62, 60)" class="pixel-art">
          <!-- Outer Circle -->
          <circle cx="0" cy="0" r="28" fill="none" stroke="#0284C7" stroke-width="2" />
          <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" stroke-width="2" />
          <circle cx="0" cy="0" r="12" fill="none" stroke="#E0F2FE" stroke-width="2" />
          <circle cx="0" cy="0" r="4" fill="#EF4444" />
          <!-- Crosshair Pixels -->
          <rect x="-32" y="-1" width="64" height="2" fill="#0284C7" fill-opacity="0.6" />
          <rect x="-1" y="-32" width="2" height="64" fill="#0284C7" fill-opacity="0.6" />
        </g>
        
        <!-- White/Cyan Title Block -->
        <rect x="22" y="100" width="80" height="12" fill="#FFFFFF" />
        <rect x="20" y="116" width="84" height="16" fill="#38BDF8" />
        <rect x="26" y="136" width="72" height="6" fill="#94A3B8" />
      </g>

      <!-- Badge (Theory TOC) -->
      <g transform="translate(69, 190)">
        <rect x="0" y="0" width="76" height="18" rx="3" fill="#005B96" />
        <text x="38" y="12.5" font-family="monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">THEORY TOC</text>
      </g>

      <text x="107" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F5F5F7" text-anchor="middle">The Goal</text>
      <text x="107" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#00BCD4" text-anchor="middle">Eliyahu M. Goldratt</text>
      <line x1="24" y1="262" x2="190" y2="262" stroke="#1F2937" stroke-width="1" />
      
      <text x="107" y="284" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Theory of Constraints (TOC)</text>
      <text x="107" y="304" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Bottleneck identification</text>
      <text x="107" y="324" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Throughput optimization</text>
    </g>

    <!-- ==================== BOOK 3: THE UNICORN PROJECT ==================== -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="214" height="350" rx="8" fill="url(#bgCard)" stroke="#1F2937" stroke-width="1.2" />
      
      <!-- PIXEL ART COVER (120x160 px) -->
      <g transform="translate(47, 16)">
        <rect x="0" y="0" width="120" height="160" rx="4" fill="#180A2A" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="8" height="160" fill="#000000" fill-opacity="0.4" rx="2" />
        
        <!-- Dark Purple Canvas -->
        <rect x="16" y="10" width="92" height="144" fill="#2E1065" />
        
        <!-- Pixel Art Origami Unicorn (Center) -->
        <g transform="translate(62, 55)" class="pixel-art">
          <!-- Horn -->
          <rect x="-1" y="-26" width="2" height="10" fill="#FDE047" />
          <rect x="-2" y="-16" width="4" height="6" fill="#FACC15" />
          <!-- Head / Mane -->
          <polygon points="-8,-10 8,-10 12,6 -12,6" fill="#C084FC" />
          <polygon points="-6,-8 6,-8 8,4 -8,4" fill="#E879F9" />
          <!-- Neck & Body -->
          <polygon points="-14,6 14,6 20,24 -20,24" fill="#A855F7" />
          <polygon points="-10,8 10,8 14,22 -14,22" fill="#F3E8FF" />
          <polygon points="-18,24 18,24 10,34 -10,34" fill="#7E22CE" />
        </g>
        
        <!-- Purple/Pink Title Block -->
        <rect x="22" y="102" width="80" height="12" fill="#FFFFFF" />
        <rect x="20" y="117" width="84" height="16" fill="#C084FC" />
        <rect x="28" y="136" width="68" height="6" fill="#E9D5FF" />
      </g>

      <!-- Badge (Architecture) -->
      <g transform="translate(64, 190)">
        <rect x="0" y="0" width="86" height="18" rx="3" fill="#581C87" />
        <text x="43" y="12.5" font-family="monospace" font-size="9" font-weight="bold" fill="#E9D5FF" text-anchor="middle" dominant-baseline="middle">ARCHITECTURE</text>
      </g>

      <text x="107" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F5F5F7" text-anchor="middle">The Unicorn Project</text>
      <text x="107" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#00BCD4" text-anchor="middle">Gene Kim</text>
      <line x1="24" y1="262" x2="190" y2="262" stroke="#1F2937" stroke-width="1" />
      
      <text x="107" y="284" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• The Five Ideals of Tech</text>
      <text x="107" y="304" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Locality &amp; Developer Joy</text>
      <text x="107" y="324" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Psychological safety</text>
    </g>

    <!-- ==================== BOOK 4: THE DEVOPS HANDBOOK ==================== -->
    <g transform="translate(684, 0)">
      <rect x="0" y="0" width="214" height="350" rx="8" fill="url(#bgCard)" stroke="#1F2937" stroke-width="1.2" />
      
      <!-- PIXEL ART COVER (120x160 px) -->
      <g transform="translate(47, 16)">
        <rect x="0" y="0" width="120" height="160" rx="4" fill="#022C22" stroke="#334155" stroke-width="1" />
        <rect x="0" y="0" width="8" height="160" fill="#000000" fill-opacity="0.4" rx="2" />
        
        <!-- Dark Emerald Canvas -->
        <rect x="16" y="10" width="92" height="144" fill="#064E3B" />
        
        <!-- Pixel Art Infinity Loop (Center) -->
        <g transform="translate(62, 58)" class="pixel-art">
          <path d="M -18 0 C -18 -12 -4 -12 0 0 C 4 12 18 12 18 0 C 18 -12 4 -12 0 0 C -4 12 -18 12 -18 0 Z" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
          <path d="M -18 0 C -18 -12 -4 -12 0 0 C 4 12 18 12 18 0 C 18 -12 4 -12 0 0 C -4 12 -18 12 -18 0 Z" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="-9" cy="-5" r="2" fill="#FFFFFF" />
          <circle cx="9" cy="5" r="2" fill="#FFFFFF" />
        </g>
        
        <!-- Emerald Title Block -->
        <rect x="22" y="102" width="80" height="12" fill="#FFFFFF" />
        <rect x="18" y="117" width="88" height="16" fill="#10B981" />
        <rect x="26" y="136" width="72" height="6" fill="#A7F3D0" />
      </g>

      <!-- Badge (Practices) -->
      <g transform="translate(71, 190)">
        <rect x="0" y="0" width="72" height="18" rx="3" fill="#065F46" />
        <text x="36" y="12.5" font-family="monospace" font-size="9" font-weight="bold" fill="#A7F3D0" text-anchor="middle" dominant-baseline="middle">PRACTICES</text>
      </g>

      <text x="107" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F5F5F7" text-anchor="middle">The DevOps Handbook</text>
      <text x="107" y="248" font-family="monospace" font-size="11" font-weight="bold" fill="#00BCD4" text-anchor="middle">Kim, Humble, Debois</text>
      <line x1="24" y1="262" x2="190" y2="262" stroke="#1F2937" stroke-width="1" />
      
      <text x="107" y="284" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Continuous Delivery (CI/CD)</text>
      <text x="107" y="304" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Telemetry &amp; feedback loops</text>
      <text x="107" y="324" font-family="sans-serif" font-size="11" fill="#B7B7BC" text-anchor="middle">• Enterprise resilience</text>
    </g>

  </g>
</svg>